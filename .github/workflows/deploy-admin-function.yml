name: Deploy HesabYar Admin Function

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/admin-dashboard/**'
      - '.github/workflows/deploy-admin-function.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Set admin email secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HESABYAR_ADMIN_EMAILS: ${{ secrets.HESABYAR_ADMIN_EMAILS }}
        run: supabase secrets set HESABYAR_ADMIN_EMAILS="$HESABYAR_ADMIN_EMAILS" --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Deploy admin function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-dashboard --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
